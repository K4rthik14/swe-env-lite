[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-agent-environment"
version = "0.1.0"
description = "A lightweight environment for software engineering agents."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "SWE Agent Environment contributors"},
]

[tool.setuptools.packages.find]
include = ["swe_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
